name: update-sources
on:
  schedule:
    - cron: "17 */6 * * *"   # 每 6 小时
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build.py | tee report.txt
      - name: Commit changes
        run: |
          git config user.name "sources-bot"
          git config user.email "sources-bot@users.noreply.github.com"
          git add live sources.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "update: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
